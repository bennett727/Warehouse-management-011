version: '3.8'

services:
  # MySQL 数据库
  mysql:
    image: mysql:8.0
    container_name: wms-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: warehouse
      MYSQL_USER: wms
      MYSQL_PASSWORD: wms123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - wms-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # 后端服务
  backend:
    build:
      context: ./spring_boot
      dockerfile: Dockerfile
    container_name: wms-backend
    environment:
      DB_URL: jdbc:mysql://wms-mysql:3306/warehouse?useSSL=false&serverTimezone=Asia/Shanghai
      DB_USERNAME: wms
      DB_PASSWORD: wms123
      JWT_SECRET: wL9vQk2mP8xN3bK7jH5gF1dS6aZ4cX9wL9vQk2mP8xN3bK7jH5gF1dS6aZ4cX9wL9vQk2mP8xN3bK7jH5gF1dS6aZ4cX9
      CORS_ALLOWED_ORIGINS: http://localhost:80
      DDL_AUTO: update
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - wms-network

  # 前端服务
  frontend:
    image: nginx:alpine
    container_name: wms-frontend
    ports:
      - "80:80"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - wms-network

volumes:
  mysql_data:

networks:
  wms-network:
    driver: bridge
