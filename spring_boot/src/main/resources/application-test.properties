# =====================================================================================
# 仓库管理系统 - 测试环境配置文件
# =====================================================================================

# -------------------------------------------------------------------------------------
# 应用配置
# -------------------------------------------------------------------------------------
spring.application.name=warehouse-management-system-test
server.port=8080
server.servlet.context-path=/api

# 允许Bean定义覆盖
spring.main.allow-bean-definition-overriding=true

# -------------------------------------------------------------------------------------
# 测试环境日志配置
# -------------------------------------------------------------------------------------
logging.level.root=WARN
logging.level.com.backend=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate.SQL=WARN

# 日志文件配置
logging.file.name=logs/test/application-test.log
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# -------------------------------------------------------------------------------------
# H2数据库配置（测试环境使用内存数据库）
# -------------------------------------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:warehouse_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MYSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2控制台配置（测试环境禁用）
spring.h2.console.enabled=false

# -------------------------------------------------------------------------------------
# JPA/Hibernate配置
# -------------------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.format_sql=false

# -------------------------------------------------------------------------------------
# 连接池配置 (HikariCP) - 测试环境
# -------------------------------------------------------------------------------------
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000

# -------------------------------------------------------------------------------------
# 初始化配置 - 测试环境启用核心初始化
# -------------------------------------------------------------------------------------
spring.sql.init.mode=never
app.data.initialize=true
app.initialization.enabled=true
app.initialization.skip-core=false
app.initialization.skip-business=false
app.initialization.skip-test=false
app.initialization.fail-fast=true
app.initialization.log-level=INFO

# -------------------------------------------------------------------------------------
# E2E测试数据初始化配置
# -------------------------------------------------------------------------------------
app.testdata.enabled=true
app.testdata.scenario=normal
app.testdata.device-count=50
app.testdata.order-count=30
app.testdata.user-count=10

# -------------------------------------------------------------------------------------
# JWT配置 - 测试环境
# -------------------------------------------------------------------------------------
jwt.secret=test-secret-key-for-testing-only
jwt.expiration=3600000
jwt.refresh-expiration=86400000

# -------------------------------------------------------------------------------------
# CORS配置 - 测试环境
# -------------------------------------------------------------------------------------
cors.allowed-origins=http://localhost:5173,http://localhost:3000
cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS,PATCH
cors.allowed-headers=*
cors.allow-credentials=true
cors.max-age=3600

# -------------------------------------------------------------------------------------
# 缓存配置 - 测试环境（禁用Redis，使用简单内存缓存）
# -------------------------------------------------------------------------------------
spring.redis.enabled=false
spring.redisson.enabled=false
spring.cache.type=simple

# -------------------------------------------------------------------------------------
# Actuator配置
# -------------------------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.prometheus.metrics.export.enabled=true

# -------------------------------------------------------------------------------------
# 线程池配置 - 测试环境
# -------------------------------------------------------------------------------------
app.thread-pool.core-size=2
app.thread-pool.max-size=5
app.thread-pool.queue-capacity=50
app.thread-pool.keep-alive-seconds=60

# -------------------------------------------------------------------------------------
# 服务注册配置 - 测试环境
# -------------------------------------------------------------------------------------
app.service.registry.enabled=false
app.service.heartbeat.enabled=false
