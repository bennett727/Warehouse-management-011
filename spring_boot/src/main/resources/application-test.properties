# =====================================================================================
# 仓库管理系统 - 测试环境配置文件
# 说明: 此文件用于E2E测试和自动化测试环境
# =====================================================================================

# -------------------------------------------------------------------------------------
# 应用配置
# -------------------------------------------------------------------------------------
spring.application.name=warehouse-management-system-test
server.port=8080
server.servlet.context-path=/api

# 允许Bean定义覆盖
spring.main.allow-bean-definition-overriding=true

# -------------------------------------------------------------------------------------
# 数据库配置 (测试环境 - H2内存数据库)
# 使用H2内存数据库可以提高测试速度，避免MySQL依赖
# -------------------------------------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2控制台配置（测试环境启用，方便调试）
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# 连接池配置
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000

# -------------------------------------------------------------------------------------
# JPA/Hibernate配置
# create-drop: 每次启动创建新表，停止时删除（适合测试环境）
# -------------------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.format_sql=true

# -------------------------------------------------------------------------------------
# 数据初始化配置
# -------------------------------------------------------------------------------------
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:test-schema-h2.sql
spring.sql.init.data-locations=classpath:test-data-h2.sql

# 启用Java数据初始化
app.data.initialize=true
app.initialization.enabled=true
app.initialization.skip-core=false
app.initialization.skip-business=false
app.initialization.skip-test=false
app.initialization.fail-fast=false

# -------------------------------------------------------------------------------------
# JWT配置 (测试环境)
# -------------------------------------------------------------------------------------
jwt.secret=test-only-jwt-secret-key-for-testing-environment-do-not-use-in-production
jwt.expiration=86400000
jwt.refresh-expiration=604800000

# -------------------------------------------------------------------------------------
# CORS配置 (测试环境允许所有来源)
# -------------------------------------------------------------------------------------
cors.allowed-origins=*
cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS,PATCH
cors.allowed-headers=*
cors.allow-credentials=true

# -------------------------------------------------------------------------------------
# 日志配置
# -------------------------------------------------------------------------------------
logging.level.com.backend=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# -------------------------------------------------------------------------------------
# Actuator配置
# -------------------------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.prometheus.metrics.export.enabled=true

# -------------------------------------------------------------------------------------
# 测试特定配置
# -------------------------------------------------------------------------------------
# 禁用邮件发送（测试环境）
spring.mail.host=localhost
spring.mail.port=25
spring.mail.username=test
spring.mail.password=test
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# 禁用定时任务（可选，测试环境）
app.scheduling.enabled=false

# 文件上传配置（使用临时目录）
app.upload.path=${java.io.tmpdir}/warehouse-test-uploads
app.upload.max-file-size=10MB
app.upload.max-request-size=100MB
