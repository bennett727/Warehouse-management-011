# =====================================================================================
# 仓库管理系统 - 主配置文件
# =====================================================================================

# -------------------------------------------------------------------------------------
# 应用配置
# -------------------------------------------------------------------------------------
spring.application.name=warehouse-management-system
server.port=8080
server.servlet.context-path=/api

# 允许Bean定义覆盖（解决重复定义问题）
spring.main.allow-bean-definition-overriding=true

# -------------------------------------------------------------------------------------
# Actuator配置
# -------------------------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.prometheus.metrics.export.enabled=true
management.metrics.tags.application=warehouse-management-system

# -------------------------------------------------------------------------------------
# Tomcat访问日志配置
# -------------------------------------------------------------------------------------
# 启用Tomcat访问日志
server.tomcat.accesslog.enabled=true
# 访问日志存放目录（相对于Tomcat基础目录，使用绝对路径更可靠）
server.tomcat.accesslog.directory=D:/Warehouse management-011/spring_boot/logs/tomcat
# 访问日志文件名前缀
server.tomcat.accesslog.prefix=access_log
# 访问日志文件名后缀
server.tomcat.accesslog.suffix=.log
# 日志格式（combined格式包含完整信息）
server.tomcat.accesslog.pattern=combined
# 是否在日志中包含日期
server.tomcat.accesslog.file-date-format=.yyyy-MM-dd
# 是否立即刷新日志
server.tomcat.accesslog.buffered=false
# 是否记录请求参数
server.tomcat.accesslog.request-attributes-enabled=true

# -------------------------------------------------------------------------------------
# 数据库配置 (MySQL生产环境)
# -------------------------------------------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/warehouse?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:123456}

# H2控制台配置（禁用）
spring.h2.console.enabled=false

# 连接池配置 (HikariCP)
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000

# -------------------------------------------------------------------------------------
# JPA/Hibernate配置
# -------------------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# -------------------------------------------------------------------------------------
# 数据初始化配置 - 仅使用Java初始化，禁用SQL初始化
# -------------------------------------------------------------------------------------
# 禁用SQL文件初始化
spring.sql.init.mode=never
spring.sql.init.schema-locations=
spring.sql.init.data-locations=

# 启用Java数据初始化
app.data.initialize=true
app.initialization.enabled=true
app.initialization.skip-core=false
app.initialization.skip-business=false
app.initialization.skip-test=true
app.initialization.fail-fast=true

# -------------------------------------------------------------------------------------
# JWT配置
# -------------------------------------------------------------------------------------
jwt.secret=${JWT_SECRET:warehouse-management-system-secret-key-2024-secure-key-for-jwt-signing}
jwt.expiration=86400000
jwt.refresh-expiration=604800000

# -------------------------------------------------------------------------------------
# CORS配置
# -------------------------------------------------------------------------------------
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS,PATCH
cors.allowed-headers=*
cors.allow-credentials=true
cors.max-age=3600

# -------------------------------------------------------------------------------------
# 日志配置
# -------------------------------------------------------------------------------------
# 日志文件路径配置（开发环境使用相对路径，生产环境建议使用绝对路径如 D:/logs/wms）
logging.file.path=logs

# 日志级别配置
logging.level.root=INFO
logging.level.com.backend=DEBUG
logging.level.com.backend.config.initialization=DEBUG
logging.level.com.backend.controller=DEBUG
logging.level.com.backend.service=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG

# 生产环境日志告警配置（通过环境变量设置）
# ALERT_ENABLED=true
# DINGTALK_WEBHOOK=https://oapi.dingtalk.com/robot/send?access_token=xxx
# WECHAT_WEBHOOK=https://qyapi.weixin.qq.com/cgi-bin/webhook/send?key=xxx

# -------------------------------------------------------------------------------------
# 文件上传配置
# -------------------------------------------------------------------------------------
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=100MB

# -------------------------------------------------------------------------------------
# Redis配置 (默认禁用，使用本地缓存)
# -------------------------------------------------------------------------------------
spring.redis.enabled=false
spring.redisson.enabled=false
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=
spring.data.redis.database=0
spring.data.redis.timeout=60000
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=0
spring.data.redis.lettuce.pool.max-wait=1000

# -------------------------------------------------------------------------------------
# 缓存配置 (使用简单内存缓存)
# -------------------------------------------------------------------------------------
spring.cache.type=simple
spring.cache.redis.time-to-live=600000
spring.cache.redis.cache-null-values=false
spring.cache.redis.use-key-prefix=true
spring.cache.redis.key-prefix=wms:

# -------------------------------------------------------------------------------------
# 告警配置
# -------------------------------------------------------------------------------------
wms.alert.enabled=true
wms.alert.api-response-time.warning=500
wms.alert.api-response-time.critical=2000
wms.alert.error-rate.warning=5.0
wms.alert.error-rate.critical=10.0
wms.alert.system-resource.memory-warning=80.0
wms.alert.system-resource.memory-critical=95.0
wms.alert.notification.cooldown-minutes=10

# -------------------------------------------------------------------------------------
# 静态资源配置
# -------------------------------------------------------------------------------------
# 启用Spring MVC静态资源处理，支持前后端一体化部署
spring.web.resources.add-mappings=true
spring.mvc.static-path-pattern=/**

# -------------------------------------------------------------------------------------
# 时区配置
# -------------------------------------------------------------------------------------
spring.jackson.time-zone=Asia/Shanghai
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
