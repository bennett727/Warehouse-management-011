# =====================================================================================
# 仓库管理系统 - 开发环境配置文件
# =====================================================================================
# 说明：此文件用于开发环境，可直接运行无需额外配置
# 生产环境请使用 application-prod.properties

# -------------------------------------------------------------------------------------
# 应用配置
# -------------------------------------------------------------------------------------
spring.application.name=warehouse-management-system
server.port=8080
server.servlet.context-path=/api

# 允许Bean定义覆盖（解决重复定义问题）
spring.main.allow-bean-definition-overriding=true

# -------------------------------------------------------------------------------------
# Actuator配置
# -------------------------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.prometheus.metrics.export.enabled=true
management.metrics.tags.application=warehouse-management-system

# -------------------------------------------------------------------------------------
# Tomcat访问日志配置
# -------------------------------------------------------------------------------------
server.tomcat.accesslog.enabled=true
server.tomcat.accesslog.directory=D:/Warehouse management-011/spring_boot/logs/tomcat
server.tomcat.accesslog.prefix=access_log
server.tomcat.accesslog.suffix=.log
server.tomcat.accesslog.pattern=combined
server.tomcat.accesslog.file-date-format=.yyyy-MM-dd
server.tomcat.accesslog.buffered=false
server.tomcat.accesslog.request-attributes-enabled=true

# -------------------------------------------------------------------------------------
# 数据库配置 (开发环境 - 本地MySQL)
# 生产环境请使用环境变量注入敏感信息：
#   export DB_URL=jdbc:mysql://prod-host:3306/warehouse?useSSL=true&serverTimezone=Asia/Shanghai
#   export DB_USERNAME=wms_user
#   export DB_PASSWORD=your_secure_password
# -------------------------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/warehouse?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:123456}

# H2控制台配置（禁用）
spring.h2.console.enabled=false

# 连接池配置 (HikariCP)
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000

# -------------------------------------------------------------------------------------
# JPA/Hibernate配置
# ddl-auto选项：
#   - create: 每次启动创建新表（会删除旧数据）
#   - create-drop: 启动创建，停止删除
#   - update: 自动更新表结构（开发环境推荐）
#   - validate: 只验证表结构，不做修改（生产环境推荐）
#   - none: 不做任何操作
# 生产环境请使用：validate 或 none
# -------------------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# -------------------------------------------------------------------------------------
# 数据初始化配置 - 仅使用Java初始化，禁用SQL初始化
# -------------------------------------------------------------------------------------
spring.sql.init.mode=never
spring.sql.init.schema-locations=
spring.sql.init.data-locations=

# 启用Java数据初始化
app.data.initialize=true
app.initialization.enabled=true
app.initialization.skip-core=false
app.initialization.skip-business=false
app.initialization.skip-test=true
app.initialization.fail-fast=true

# -------------------------------------------------------------------------------------
# JWT配置 (开发环境)
# 注意：生产环境请使用环境变量或外部配置注入 JWT_SECRET
# 示例：export JWT_SECRET=$(openssl rand -base64 64)
# -------------------------------------------------------------------------------------
jwt.secret=${JWT_SECRET:dev-only-jwt-secret-key-for-development-environment-do-not-use-in-production}
jwt.expiration=${JWT_EXPIRATION:86400000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}

# -------------------------------------------------------------------------------------
# CORS配置
# 生产环境请限制为实际的前端域名，例如：
# cors.allowed-origins=https://your-domain.com,https://admin.your-domain.com
# -------------------------------------------------------------------------------------
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:8080}
cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS,PATCH
cors.allowed-headers=${CORS_ALLOWED_HEADERS:Authorization,Content-Type,X-Requested-With,Accept,Origin,Access-Control-Request-Method,Access-Control-Request-Headers}
cors.allow-credentials=${CORS_ALLOW_CREDENTIALS:true}
cors.max-age=3600

# -------------------------------------------------------------------------------------
# 日志配置
# -------------------------------------------------------------------------------------
logging.file.path=logs

# 日志级别配置
# 开发环境：详细日志
# 生产环境建议：
#   logging.level.root=WARN
#   logging.level.com.backend=INFO
#   logging.level.org.hibernate.SQL=OFF
logging.level.root=INFO
logging.level.com.backend=DEBUG
logging.level.com.backend.config.initialization=DEBUG
logging.level.com.backend.controller=DEBUG
logging.level.com.backend.service=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG

# -------------------------------------------------------------------------------------
# 文件上传配置
# -------------------------------------------------------------------------------------
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=100MB

# -------------------------------------------------------------------------------------
# Redis配置 (开发环境禁用，使用本地缓存)
# -------------------------------------------------------------------------------------
spring.redis.enabled=false
spring.redisson.enabled=false
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=
spring.data.redis.database=0
spring.data.redis.timeout=60000
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=0
spring.data.redis.lettuce.pool.max-wait=1000

# -------------------------------------------------------------------------------------
# 缓存配置 (使用简单内存缓存)
# -------------------------------------------------------------------------------------
spring.cache.type=simple
spring.cache.redis.time-to-live=600000
spring.cache.redis.cache-null-values=false
spring.cache.redis.use-key-prefix=true
spring.cache.redis.key-prefix=wms:

# -------------------------------------------------------------------------------------
# 告警配置
# -------------------------------------------------------------------------------------
wms.alert.enabled=true
wms.alert.api-response-time.warning=500
wms.alert.api-response-time.critical=2000
wms.alert.error-rate.warning=5.0
wms.alert.error-rate.critical=10.0
wms.alert.system-resource.memory-warning=80.0
wms.alert.system-resource.memory-critical=95.0
wms.alert.notification.cooldown-minutes=10

# -------------------------------------------------------------------------------------
# 静态资源配置
# -------------------------------------------------------------------------------------
spring.web.resources.add-mappings=true
spring.mvc.static-path-pattern=/**

# -------------------------------------------------------------------------------------
# 时区配置
# -------------------------------------------------------------------------------------
spring.jackson.time-zone=Asia/Shanghai
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
