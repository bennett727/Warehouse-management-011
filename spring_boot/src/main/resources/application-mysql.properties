# =====================================================================================
# 仓库管理系统 - MySQL真实数据库配置文件
# 用于连接本地MySQL数据库 (Navicat: TL_warehouse)
# 数据库: warehouse
# 连接: localhost:3306
# 
# 使用方法: 在application.properties中设置 spring.profiles.active=mysql
# 或启动时添加参数: --spring.profiles.active=mysql
# =====================================================================================

# -------------------------------------------------------------------------------------
# MySQL数据库配置 (真实数据库)
# -------------------------------------------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/warehouse?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=UTF-8
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=123456

# 禁用H2控制台
spring.h2.console.enabled=false

# SQL初始化配置 - 禁用SQL文件初始化，使用Java代码初始化
# 避免Java初始化和SQL脚本冲突
spring.sql.init.mode=never
# spring.sql.init.data-locations=classpath:sql/init_test_data_mysql.sql
# spring.jpa.defer-datasource-initialization=true

# -------------------------------------------------------------------------------------
# JPA/Hibernate配置 (MySQL)
# -------------------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=false

# -------------------------------------------------------------------------------------
# 连接池配置 (HikariCP)
# -------------------------------------------------------------------------------------
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.leak-detection-threshold=60000
spring.datasource.hikari.validation-timeout=3000

# -------------------------------------------------------------------------------------
# 统一初始化配置 - 使用新的统一初始化器
# -------------------------------------------------------------------------------------
app.data.use.legacy.initializer=false
app.data.use.legacy.manager=false
app.data.initialize=true

# -------------------------------------------------------------------------------------
# 日志配置
# -------------------------------------------------------------------------------------
logging.level.com.backend.config.initialization=DEBUG
logging.level.com.backend=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# -------------------------------------------------------------------------------------
# 服务器配置
# -------------------------------------------------------------------------------------
server.port=8080
server.servlet.context-path=/api

# -------------------------------------------------------------------------------------
# 加密配置
# -------------------------------------------------------------------------------------
jwt.secret=warehouse-management-system-secret-key-2024-secure-key-for-jwt-signing
jwt.expiration=86400000
app.encryption.secret-key=warehouse-encryption-secret-key-2024
