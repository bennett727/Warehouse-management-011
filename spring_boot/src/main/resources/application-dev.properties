# =====================================================================================
# 仓库管理系统 - 开发环境配置文件
# =====================================================================================

# -------------------------------------------------------------------------------------
# 应用配置
# -------------------------------------------------------------------------------------
spring.application.name=warehouse-management-system-dev
server.port=8080
server.servlet.context-path=/api

# 允许Bean定义覆盖
spring.main.allow-bean-definition-overriding=true

# -------------------------------------------------------------------------------------
# 开发环境日志配置
# -------------------------------------------------------------------------------------
logging.level.root=INFO
logging.level.com.backend=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# 日志文件配置
logging.file.name=logs/dev/application-dev.log
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# -------------------------------------------------------------------------------------
# H2数据库配置（开发环境使用内存数据库）
# -------------------------------------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:warehouse_dev;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MYSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2控制台配置（开发环境启用）
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# -------------------------------------------------------------------------------------
# JPA/Hibernate配置
# -------------------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true

# -------------------------------------------------------------------------------------
# 连接池配置 (HikariCP) - 开发环境较小配置
# -------------------------------------------------------------------------------------
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000

# -------------------------------------------------------------------------------------
# 初始化配置 - 开发环境启用所有初始化
# -------------------------------------------------------------------------------------
spring.sql.init.mode=never
app.data.initialize=true
app.initialization.enabled=true
app.initialization.skip-core=false
app.initialization.skip-business=false
app.initialization.skip-test=false
app.initialization.fail-fast=false
app.initialization.log-level=DEBUG

# -------------------------------------------------------------------------------------
# JWT配置 - 开发环境使用简单密钥
# -------------------------------------------------------------------------------------
jwt.secret=dev-secret-key-for-testing-only-do-not-use-in-production
jwt.expiration=86400000
jwt.refresh-expiration=604800000

# -------------------------------------------------------------------------------------
# CORS配置 - 开发环境允许所有来源
# -------------------------------------------------------------------------------------
cors.allowed-origins=*
cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS,PATCH
cors.allowed-headers=*
cors.allow-credentials=true
cors.max-age=3600

# -------------------------------------------------------------------------------------
# 缓存配置 - 开发环境禁用或简化
# -------------------------------------------------------------------------------------
spring.cache.type=simple

# -------------------------------------------------------------------------------------
# Actuator配置 - 开发环境暴露所有端点
# -------------------------------------------------------------------------------------
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
management.prometheus.metrics.export.enabled=true

# -------------------------------------------------------------------------------------
# 开发工具配置
# -------------------------------------------------------------------------------------
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true

# -------------------------------------------------------------------------------------
# 线程池配置 - 开发环境
# -------------------------------------------------------------------------------------
app.thread-pool.core-size=2
app.thread-pool.max-size=10
app.thread-pool.queue-capacity=100
app.thread-pool.keep-alive-seconds=60

# -------------------------------------------------------------------------------------
# 服务注册配置 - 开发环境
# -------------------------------------------------------------------------------------
app.service.registry.enabled=false
app.service.heartbeat.enabled=false
