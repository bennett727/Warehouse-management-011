name: Frontend CI/CD

on:
  push:
    branches: [ main, develop ]
    paths: [ frontend/** ]
  pull_request:
    branches: [ main, develop ]
    paths: [ frontend/** ]

env:
  NODE_VERSION: '20'
  CACHE_KEY_PREFIX: 'frontend-deps'

jobs:
  # ===========================================================================
  # 代码质量检查
  # ===========================================================================
  code-quality:
    name: Code Quality Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ./frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Check code format
        run: npm run format:check

      - name: Check file encoding
        run: npm run check-encoding

      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '❌ CI Failed: Frontend Code Quality Check',
              body: `Frontend code quality check failed on commit ${context.sha}\n\nWorkflow: ${context.workflow}\nRun: ${context.runId}\n\nPlease run \`npm run lint\` and \`npm run format\` locally to fix issues.`,
              labels: ['ci-failure', 'frontend', 'code-quality']
            })

  # ===========================================================================
  # 单元测试
  # ===========================================================================
  unit-test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: code-quality
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ./frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test -- --coverage

      - name: Check coverage thresholds
        run: |
          echo "📊 Coverage Report Summary"
          echo "=========================="
          if [ -f "./coverage/coverage-summary.json" ]; then
            cat ./coverage/coverage-summary.json | jq -r '
              "Lines: \(.total.lines.pct)% (\(.total.lines.covered)/\(.total.lines.total))",
              "Statements: \(.total.statements.pct)% (\(.total.statements.covered)/\(.total.statements.total))",
              "Functions: \(.total.functions.pct)% (\(.total.functions.covered)/\(.total.functions.total))",
              "Branches: \(.total.branches.pct)% (\(.total.branches.covered)/\(.total.branches.total))"
            '
          fi
          echo ""
          echo "✅ Coverage thresholds: Lines≥70%, Functions≥70%, Branches≥60%"
  
      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        with:
          file: ./frontend/coverage/lcov.info
          flags: frontend
          name: frontend-coverage
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload test artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-test-results
          path: ./frontend/coverage
          retention-days: 7

      - name: Add coverage to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let coverageComment = '## 📊 Test Coverage Report\n\n';
            
            try {
              const summary = JSON.parse(fs.readFileSync('./frontend/coverage/coverage-summary.json', 'utf8'));
              coverageComment += '| Metric | Coverage | Covered/Total |\n';
              coverageComment += '|--------|----------|---------------|\n';
              coverageComment += `| Lines | ${summary.total.lines.pct}% | ${summary.total.lines.covered}/${summary.total.lines.total} |\n`;
              coverageComment += `| Statements | ${summary.total.statements.pct}% | ${summary.total.statements.covered}/${summary.total.statements.total} |\n`;
              coverageComment += `| Functions | ${summary.total.functions.pct}% | ${summary.total.functions.covered}/${summary.total.functions.total} |\n`;
              coverageComment += `| Branches | ${summary.total.branches.pct}% | ${summary.total.branches.covered}/${summary.total.branches.total} |\n`;
            } catch (e) {
              coverageComment += 'Coverage report not available.\n';
            }
            
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: coverageComment
            });

  # ===========================================================================
  # 构建测试
  # ===========================================================================
  build:
    name: Build Test
    runs-on: ubuntu-latest
    needs: unit-test
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ./frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: ./frontend/dist
          retention-days: 7

      - name: Check build size
        run: |
          echo "Build size analysis:"
          du -sh ./dist
          echo ""
          echo "Top 10 largest files:"
          find ./dist -type f -exec du -h {} + | sort -rh | head -10

  # ===========================================================================
  # 部署到生产环境
  # ===========================================================================
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [code-quality, unit-test, build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}

    steps:
      - uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: ./frontend/dist

      - name: Deploy to production
        id: deploy
        # Add your deployment step here
        # Example: Using rsync to deploy to a server
        # run: rsync -avz ./dist/ user@server:/path/to/deploy
        run: |
          echo "Deploying to production..."
          echo "url=https://your-production-url.com" >> $GITHUB_OUTPUT

      - name: Notify deployment success
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '✅ Deployment Successful: Frontend',
              body: `Frontend successfully deployed to production.\n\nCommit: ${context.sha}\nWorkflow: ${context.workflow}`,
              labels: ['deployment', 'frontend', 'success']
            })
