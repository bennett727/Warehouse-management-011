# E2E测试自动化工作流
# 触发条件: 推送到main分支或创建PR
name: E2E Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  # 允许手动触发
  workflow_dispatch:

jobs:
  e2e-tests:
    runs-on: ubuntu-latest
    
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: 123456
          MYSQL_DATABASE: warehouse_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install frontend dependencies
      run: |
        cd frontend
        npm ci

    - name: Build frontend
      run: |
        cd frontend
        npm run build

    - name: Wait for MySQL
      run: |
        sudo apt-get install -y mysql-client
        while ! mysqladmin ping -h127.0.0.1 -P3306 --silent; do
          sleep 1
        done

    - name: Start backend server
      run: |
        cd spring_boot
        ./mvnw spring-boot:run -Dspring-boot.run.profiles=test &
        # 等待后端启动
        npx wait-on http://localhost:8080/api/health --timeout 120000
      env:
        DB_URL: jdbc:mysql://localhost:3306/warehouse_test?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
        DB_USERNAME: root
        DB_PASSWORD: 123456
        DDL_AUTO: create-drop

    - name: Run E2E tests
      run: |
        cd frontend
        npm run test:e2e -- --headless --browser chrome
      env:
        CYPRESS_baseUrl: http://localhost:5173
        CYPRESS_apiUrl: http://localhost:8080/api

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: cypress-test-results
        path: |
          frontend/tests/cypress/screenshots
          frontend/tests/cypress/videos
          frontend/tests/cypress/reports

    - name: Upload coverage report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: frontend/coverage

  # 测试报告汇总
  test-summary:
    needs: e2e-tests
    runs-on: ubuntu-latest
    if: always()
    
    steps:
    - name: Download test results
      uses: actions/download-artifact@v4
      with:
        name: cypress-test-results
        path: test-results

    - name: Generate test summary
      run: |
        echo "## E2E Test Results" >> $GITHUB_STEP_SUMMARY
        echo "### Test Status: ${{ needs.e2e-tests.result }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
        echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
        echo "| Status | ${{ needs.e2e-tests.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Timestamp | $(date) |" >> $GITHUB_STEP_SUMMARY
