name: Backend CI/CD

on:
  push:
    branches: [ main, develop ]
    paths: [ spring_boot/** ]
  pull_request:
    branches: [ main, develop ]
    paths: [ spring_boot/** ]

jobs:
  code-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./spring_boot

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
          cache-dependency-path: ./spring_boot/pom.xml

      - name: Install dependencies
        run: mvn dependency:go-offline

      - name: Run SpotBugs static analysis
        run: mvn spotbugs:check

      - name: Upload SpotBugs report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: spotbugs-report
          path: ./spring_boot/target/spotbugsXml.xml
          retention-days: 7

  build-and-test:
    runs-on: ubuntu-latest
    needs: code-quality
    defaults:
      run:
        working-directory: ./spring_boot

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
          cache-dependency-path: ./spring_boot/pom.xml

      - name: Install dependencies
        run: mvn dependency:go-offline

      - name: Run tests with coverage
        run: mvn clean test jacoco:report

      - name: Check test coverage
        run: mvn jacoco:check

      - name: Upload JaCoCo coverage report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: ./spring_boot/target/site/jacoco/index.html
          retention-days: 7

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./spring_boot/target/site/jacoco/jacoco.xml
          flags: backend
          name: backend-coverage
          fail_ci_if_error: false

      - name: Build
        run: mvn package -DskipTests

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: backend-build
          path: ./spring_boot/target/*.jar
          retention-days: 7

      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'CI/CD Failed: Backend Build and Test',
              body: `Backend build and test failed on commit ${context.sha}\n\nWorkflow: ${context.workflow}\nRun: ${context.runId}`,
              labels: ['ci-failure', 'backend']
            })

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main'
    defaults:
      run:
        working-directory: ./spring_boot

    steps:
      - uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: backend-build
          path: ./spring_boot/target

      - name: Deploy to production
        run: echo "Deploying to production..."
